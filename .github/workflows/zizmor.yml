name: Zizmor # Static security analysis of GitHub Actions workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Scan workflows for security anti-patterns
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: false
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to match the uv version range this repo's other CI jobs install
      # (.github/workflows/constraints.txt: uv>=0.11.32,<0.12). setup-uv still
      # fetches its version manifest from raw.githubusercontent.com even with
      # an explicit version pinned here, so that endpoint stays allowlisted
      # above regardless.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # zizmor recognizes both .yml and .yaml workflow files when given the
      # directory directly, which is what this repo needs since it mixes
      # both extensions under .github/workflows.
      - name: Run zizmor
        run: uvx zizmor==1.30.1 --min-severity high .github/workflows
