# pre-commit is a linter runner and GitHub hook manager
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Run `pre-commit autoupdate` now and then, why don't ya?

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: end-of-file-fixer
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: check-ast
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2200"]
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter. Replaces black.
      - id: ruff-format

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        description: Automatically upgrade syntax for newer versions.
        types: [python]
        args: [--py310-plus]

# Prettier is failing in CI for Markdown files, so we disable it for now. It does not do much for us anyway.
#  - repo: https://github.com/pre-commit/mirrors-prettier
#    rev: v4.0.0-alpha.8
#    hooks:
#      - id: prettier

  # Linter for markdown files
  # rumdl is a native (Rust) reimplementation of markdownlint with drop-in rule
  # compatibility, so no Docker container is needed for this hook.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.77
    hooks:
      - id: rumdl

  # Scan for secrets
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker

  # Lint GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: local
    hooks:
      - id: block-files
        name: Block forbidden files
        entry: ./scripts/block-files.sh
        language: script
        pass_filenames: false
        always_run: true
